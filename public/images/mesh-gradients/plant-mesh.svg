<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Green-Teal Gradients -->
    <radialGradient id="green-blob1" cx="0.3" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#d1fae5" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6ee7b7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.3"/>
    </radialGradient>

    <radialGradient id="green-blob2" cx="0.7" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </radialGradient>

    <radialGradient id="green-blob3" cx="0.5" cy="0.8" r="0.5">
      <stop offset="0%" stop-color="#99f6e4" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.2"/>
    </radialGradient>

    <radialGradient id="green-blob4" cx="0.2" cy="0.7" r="0.4">
      <stop offset="0%" stop-color="#d1fae5" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a7f3d0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0.3"/>
    </radialGradient>

    <filter id="green-glow">
      <feGaussianBlur stdDeviation="40" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base layer -->
  <rect width="1200" height="800" fill="#f0fdf4"/>

  <!-- Mesh gradient blobs -->
  <g filter="url(#green-glow)">
    <!-- Blob 1 - Top left -->
    <ellipse cx="250" cy="200" rx="400" ry="340" fill="url(#green-blob1)" opacity="0.8">
      <animate attributeName="cx" values="250;300;250" dur="21s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;170;200" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="400;440;400" dur="19s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Blob 2 - Top right -->
    <ellipse cx="920" cy="230" rx="440" ry="400" fill="url(#green-blob2)" opacity="0.7">
      <animate attributeName="cx" values="920;870;920" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="230;260;230" dur="23s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="400;360;400" dur="17s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Blob 3 - Bottom right -->
    <ellipse cx="870" cy="620" rx="380" ry="360" fill="url(#green-blob3)" opacity="0.6">
      <animate attributeName="cx" values="870;920;870" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="620;600;620" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="380;420;380" dur="22s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Blob 4 - Bottom left -->
    <ellipse cx="280" cy="630" rx="360" ry="320" fill="url(#green-blob4)" opacity="0.75">
      <animate attributeName="cx" values="280;230;280" dur="23s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="630;600;630" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="320;360;320" dur="21s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Center blob for blend -->
    <ellipse cx="600" cy="400" rx="470" ry="420" fill="url(#green-blob1)" opacity="0.4">
      <animate attributeName="rx" values="470;500;470" dur="26s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="420;440;420" dur="24s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
