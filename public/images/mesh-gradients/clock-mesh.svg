<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Cyan-Blue Gradients -->
    <radialGradient id="cyan-blob1" cx="0.3" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#cffafe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.3"/>
    </radialGradient>

    <radialGradient id="cyan-blob2" cx="0.7" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </radialGradient>

    <radialGradient id="cyan-blob3" cx="0.5" cy="0.8" r="0.5">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </radialGradient>

    <radialGradient id="cyan-blob4" cx="0.2" cy="0.7" r="0.4">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.3"/>
    </radialGradient>

    <filter id="cyan-glow">
      <feGaussianBlur stdDeviation="40" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base layer -->
  <rect width="1200" height="800" fill="#f0f9ff"/>

  <!-- Mesh gradient blobs -->
  <g filter="url(#cyan-glow)">
    <!-- Blob 1 - Top left -->
    <ellipse cx="220" cy="190" rx="390" ry="330" fill="url(#cyan-blob1)" opacity="0.8">
      <animate attributeName="cx" values="220;270;220" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="190;160;190" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="390;430;390" dur="18s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Blob 2 - Top right -->
    <ellipse cx="910" cy="240" rx="430" ry="390" fill="url(#cyan-blob2)" opacity="0.7">
      <animate attributeName="cx" values="910;860;910" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="240;270;240" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="390;350;390" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Blob 3 - Bottom right -->
    <ellipse cx="860" cy="610" rx="370" ry="350" fill="url(#cyan-blob3)" opacity="0.6">
      <animate attributeName="cx" values="860;910;860" dur="24s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="610;590;610" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="370;410;370" dur="21s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Blob 4 - Bottom left -->
    <ellipse cx="290" cy="640" rx="350" ry="310" fill="url(#cyan-blob4)" opacity="0.75">
      <animate attributeName="cx" values="290;240;290" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="640;610;640" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="310;350;310" dur="20s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Center blob for blend -->
    <ellipse cx="600" cy="400" rx="460" ry="410" fill="url(#cyan-blob1)" opacity="0.4">
      <animate attributeName="rx" values="460;490;460" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="410;430;410" dur="23s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
