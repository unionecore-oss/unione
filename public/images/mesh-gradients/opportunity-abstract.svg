<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Opportunity/open doors gradient theme -->
    <linearGradient id="opp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa709a" />
      <stop offset="50%" stop-color="#fee140" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>

    <radialGradient id="opp-circle1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffecd2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fcb69f" stop-opacity="0.2"/>
    </radialGradient>

    <radialGradient id="opp-circle2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9a56" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff6a88" stop-opacity="0.2"/>
    </radialGradient>

    <linearGradient id="opp-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="light-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="opp-glow">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base gradient -->
  <rect width="1200" height="800" fill="url(#opp-bg)"/>

  <!-- Warm floating shapes -->
  <g filter="url(#opp-glow)">
    <ellipse cx="220" cy="580" rx="220" ry="200" fill="url(#opp-circle1)" opacity="0.7">
      <animate attributeName="cx" values="220;250;220" dur="23s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="580;550;580" dur="20s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="920" cy="220" rx="240" ry="210" fill="url(#opp-circle2)" opacity="0.6">
      <animate attributeName="rx" values="240;260;240" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="210;230;210" dur="22s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="450" cy="180" rx="170" ry="160" fill="url(#opp-circle1)" opacity="0.5">
      <animate attributeName="cy" values="180;210;180" dur="28s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="980" cy="640" rx="190" ry="170" fill="url(#opp-circle2)" opacity="0.45">
      <animate attributeName="rx" values="190;210;190" dur="21s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Abstract door/opening concept with light beams -->
  <g opacity="0.3" filter="url(#opp-glow)">
    <!-- Light beams emanating from center -->
    <path d="M 600 400 L 350 150" stroke="url(#light-beam)" stroke-width="60" stroke-linecap="round">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M 600 400 L 850 150" stroke="url(#light-beam)" stroke-width="60" stroke-linecap="round">
      <animate attributeName="opacity" values="0.25;0.45;0.25" dur="5.5s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <path d="M 600 400 L 850 650" stroke="url(#light-beam)" stroke-width="60" stroke-linecap="round">
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="6s" repeatCount="indefinite" begin="1s"/>
    </path>
    <path d="M 600 400 L 350 650" stroke="url(#light-beam)" stroke-width="60" stroke-linecap="round">
      <animate attributeName="opacity" values="0.28;0.48;0.28" dur="5.2s" repeatCount="indefinite" begin="1.5s"/>
    </path>
  </g>

  <!-- Opening door frame effect -->
  <g opacity="0.2">
    <rect x="500" y="200" width="200" height="400" rx="10" stroke="url(#opp-accent)" stroke-width="4" fill="none">
      <animate attributeName="width" values="200;220;200" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Decorative flowing curves -->
  <g stroke="url(#opp-accent)" stroke-width="2.5" opacity="0.25" fill="none">
    <path d="M 150 300 Q 350 250, 550 300">
      <animate attributeName="d"
        values="M 150 300 Q 350 250, 550 300; M 150 300 Q 350 280, 550 300; M 150 300 Q 350 250, 550 300"
        dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M 650 500 Q 850 450, 1050 500">
      <animate attributeName="d"
        values="M 650 500 Q 850 450, 1050 500; M 650 500 Q 850 480, 1050 500; M 650 500 Q 850 450, 1050 500"
        dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
