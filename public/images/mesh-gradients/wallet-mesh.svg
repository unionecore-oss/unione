<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Purple-Blue Gradients -->
    <radialGradient id="blob1" cx="0.3" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#ddd6fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3"/>
    </radialGradient>

    <radialGradient id="blob2" cx="0.7" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.2"/>
    </radialGradient>

    <radialGradient id="blob3" cx="0.5" cy="0.8" r="0.5">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </radialGradient>

    <radialGradient id="blob4" cx="0.2" cy="0.7" r="0.4">
      <stop offset="0%" stop-color="#e0e7ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c7d2fe" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0.3"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="40" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base layer -->
  <rect width="1200" height="800" fill="#faf5ff"/>

  <!-- Mesh gradient blobs -->
  <g filter="url(#glow)">
    <!-- Blob 1 - Top left -->
    <ellipse cx="200" cy="180" rx="380" ry="320" fill="url(#blob1)" opacity="0.8">
      <animate attributeName="cx" values="200;250;200" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="180;150;180" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="380;420;380" dur="18s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Blob 2 - Top right -->
    <ellipse cx="900" cy="250" rx="420" ry="380" fill="url(#blob2)" opacity="0.7">
      <animate attributeName="cx" values="900;850;900" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="250;280;250" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="380;340;380" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Blob 3 - Bottom right -->
    <ellipse cx="850" cy="600" rx="360" ry="340" fill="url(#blob3)" opacity="0.6">
      <animate attributeName="cx" values="850;900;850" dur="24s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="600;580;600" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="360;400;360" dur="21s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Blob 4 - Bottom left -->
    <ellipse cx="300" cy="650" rx="340" ry="300" fill="url(#blob4)" opacity="0.75">
      <animate attributeName="cx" values="300;250;300" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="650;620;650" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="300;340;300" dur="20s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Center blob for blend -->
    <ellipse cx="600" cy="400" rx="450" ry="400" fill="url(#blob1)" opacity="0.4">
      <animate attributeName="rx" values="450;480;450" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="400;420;400" dur="23s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
