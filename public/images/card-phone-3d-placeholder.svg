<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Placeholder for 3D card-phone image -->
  <rect width="1200" height="800" fill="url(#gradient1)"/>
  <defs>
    <linearGradient id="gradient1" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <!-- Phone shape -->
  <rect x="400" y="250" width="400" height="300" rx="20" fill="#1f2937" opacity="0.8"/>
  <!-- Card shape floating above -->
  <rect x="450" y="150" width="300" height="180" rx="12" fill="url(#cardGradient)"/>
  <defs>
    <linearGradient id="cardGradient" x1="450" y1="150" x2="750" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Placeholder text -->
  <text x="600" y="700" font-family="Arial, sans-serif" font-size="24" fill="#64748b" text-anchor="middle">
    Replace with actual 3D image (1200x800px)
  </text>
</svg>
